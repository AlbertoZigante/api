[project]
name = "api"
version = "0.1.0"
description = "Backend for the DIY furniture platform: BOM, nesting, catalog"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]  # FastAPI dependency-injection idiom

[tool.ruff.lint.per-file-ignores]
"app/services/*" = ["E501"]  # direct ports of the JS engine: keep lines comparable to the original
"tests/*" = ["E501"]  # long literal fixtures / one-line assertions

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["app", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
